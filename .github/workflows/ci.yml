
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   
    inputs:
      config:
        description: 'CMake build config'
        required: false
        default: 'Release'

jobs:
  # ------------------------------
  # Linux: GCC + CMake
  # ------------------------------
  linux-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
    runs-on: ${{matrix.os}}

    env:
      BUILD_TYPE: ${{ github.event.inputs.config || 'Release' }}   # define build type

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -yq libboost-dev 
          sudo apt-get install -y libeigen3-dev
  
      - name: Checkout GridLAB-D
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build GridLAB-D
        run: |
          threads=$(nproc)
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=~/.temp/GridLAB-D \
          -DGLD_CI_BUILD=ON
          cmake --build ${{github.workspace}}/build  --parallel $threads

      - name: Install GridLAB-D
        working-directory: ${{github.workspace}}/build
        run: cmake --install . 

      - name: Run GridLAB-D autotests
        working-directory: ${{github.workspace}}
        run: |
          # Add installed GridLAB-D binaries to PATH
          export PREFIX="$HOME/.temp/GridLAB-D"
          export PATH=$PATH:$PREFIX/bin
          # Make sure runtime linker can locate shared libs
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}:$PREFIX/lib:$PREFIX/lib/gridlabd"

          # Optional: help GridLAB-D locate core/share paths
          export GLPATH="$(pwd):${PREFIX}:${PREFIX}/bin:${PREFIX}/lib:${PREFIX}/share:${{github.workspace}}/gldcore"
          # Sanity checks
          echo "PATH=$PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "GLPATH=$GLPATH"
          # Verify dependencies (helps debug rpath/loader issues)
          which gridlabd || { echo "gridlabd not found in PATH"; exit 1; }
          ldd "$(which gridlabd)" || true
          
          # Run integration validation from repository root
          gridlabd -T 0 --validate
          # Future Catch2 unit tests (placeholder):
          # ./build/tests/unit_tests --reporter junit --out unit-tests-linux.xml
          # Current ctest invocation (unit + any ctest-based tests)
          ctest --verbose

  
  # ------------------------------
  # Windows: Visual Studio 2022 + vcpkg manifest mode
  # ------------------------------
  win-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg (manifest mode + cache)
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          logCollectionRegExps: |
            .*/CMakeOutput\.log$
            .*/CMakeError\.log$
            .*/vcpkg/buildtrees/.+\.log$

      - name: Upload vcpkg & CMake logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-and-cmake-logs
          path: |
            ${{ github.workspace }}/vcpkg/buildtrees/**/*.log
            out/build/ci-windows/**/CMakeOutput.log
            out/build/ci-windows/**/CMakeError.log

      - name: Clean install prefix (Windows)
        shell: pwsh
        run: |
         $installRoot = "$env:USERPROFILE\.temp\GridLAB-D"
         if (Test-Path $installRoot) {
            Write-Host "Removing previous install at $installRoot..."
            Remove-Item -Path $installRoot -Recurse -Force -ErrorAction SilentlyContinue
         }


      - name: Configure CMake (VS2022 + vcpkg toolchain)
        shell: pwsh
        run: >
            cmake -S .
            --log-level=VERBOSE
            --log-context
            --debug-output
            -B out/build/ci-windows
            -G "Visual Studio 17 2022"
            -A x64
            -DCMAKE_CONFIGURATION_TYPES="Debug;Release"
            -DVCPKG_TARGET_TRIPLET=x64-windows
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            "-DCMAKE_INSTALL_PREFIX=$env:USERPROFILE/.temp/GridLAB-D"
            -DGLD_CI_BUILD=ON

      - name: Build gridlabd (Release)
        shell: pwsh
        run: cmake --build out/build/ci-windows --config Release -t ALL_BUILD
        env:
          CFLAGS: "/W0"
          CXXFLAGS: "/W0"

      - name: Verify gldapi.dll before install
        shell: pwsh
        run: |
         $src = Resolve-Path "out/build/ci-windows/bin/Release/gldapi.dll"
         Write-Host "Found: $src"
         Get-Item $src | Format-List *


      - name: Show install prefix
        shell: pwsh
        run: |
          Write-Host "CMAKE_INSTALL_PREFIX=$env:USERPROFILE\.temp\GridLAB-D"
          if (Test-Path "$env:USERPROFILE\.temp\GridLAB-D") {
            Get-ChildItem "$env:USERPROFILE\.temp\GridLAB-D" -Recurse | Select-Object FullName
          } else {
            Write-Host "Install prefix does not yet exist."
          }


      - name: Install GridLAB-D
        shell: pwsh
        run: cmake --install out/build/ci-windows --config Release --verbose

      - name: List installed DLLs and EXEs
        shell: pwsh
        run: |
          $installRoot = "$env:USERPROFILE\.temp\GridLAB-D"
          Write-Host "Listing under $installRoot..."
          Get-ChildItem -Path $installRoot -Include *.dll, *.exe -Recurse | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Run gridlabd --validate
        shell: pwsh
        continue-on-error: true
        run: |
          $buildDir = Resolve-Path "out/build/ci-windows"
          $exe = Get-ChildItem -Path $buildDir -Filter gridlabd.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "gridlabd.exe not found." }
          & $exe.FullName --version
          $binDir   = Split-Path $exe.FullName -Parent
          $shareDir = Resolve-Path "out/build/ci-windows/share"
          $libDir   = Resolve-Path "out/build/ci-windows/lib"
          $gldcore  = Resolve-Path "gldcore"
          $env:GLPATH = "$pwd;$buildDir;$binDir;$libDir;$shareDir;$gldcore"
          $env:PATH   = "$env:PATH;$binDir"
          Write-Host "GRIDLABD=$env:GRIDLABD"
          Write-Host "GLPATH=$env:GLPATH"
          & $exe.FullName --redirect none  --validate

      # - name: Run CTest
      #   shell: pwsh
      #   working-directory: out/build/ci-windows
      #   run: ctest -C Release --output-on-failure

    
  # ------------------------------
  # macOS: AppleClang + Homebrew
  # ------------------------------
  build-and-validate-macos:
    runs-on: macos-15  # ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Optional: cache brew downloads to speed up CI runs
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/Brewfile') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools and Eigen via Homebrew
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew not found"; exit 1
          fi

          brew update

          # Prefer reproducible installs from Brewfile if present
          if [[ -f ci/Brewfile ]]; then
            brew bundle --file=ci/Brewfile
          else
            # Fallback inline install — minimal set mirroring Windows vcpkg.json
            brew install cmake ninja pkg-config eigen
          fi

          HOMEBREW_PREFIX="$(brew --prefix)"
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}"

          # Help CMake find Homebrew-installed packages
          export PKG_CONFIG_PATH="${HOMEBREW_PREFIX}/lib/pkgconfig:${HOMEBREW_PREFIX}/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
          echo "CMAKE_PREFIX_PATH=${HOMEBREW_PREFIX}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"   >> "$GITHUB_ENV"


      - name: Print toolchain info
        run: |
          sw_vers
          clang --version
          cmake --version
          ninja --version
          brew list --versions cmake ninja pkg-config eigen

      - name: Clean build
        run: |
          rm -rf build/ out/ CMakeCache.txt CMakeFiles 2>/dev/null || true

      - name: Configure CMake (AppleClang + Ninja)
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}
          PKG_CONFIG_PATH:   ${{ env.PKG_CONFIG_PATH }}
        run: |
          set -euxo pipefail
          BUILD_DIR="out/build/ci-macos"

          cmake -S . -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DCMAKE_MACOSX_RPATH=ON \
            -DCMAKE_INSTALL_RPATH="$HOME/.temp/GridLAB-D/lib;$HOME/.temp/GridLAB-D/lib/gridlabd"

      - name: Build (Release)
        shell: bash
        run: |
          cmake --build out/build/ci-macos -- -v

      - name: Install (Release)
        shell: bash
        run: |
          cmake --install out/build/ci-macos --prefix "$HOME/.temp/GridLAB-D" --verbose
      
      - name: List loaded modules
        shell: bash
        run: |
          /Users/runner/.temp/GridLAB-D/bin/gridlabd --modhelp

      - name: Debug library loading
        run: |
          PREFIX="$HOME/.temp/GridLAB-D"
          LIB_DIR="$PREFIX/lib"
          export DYLD_LIBRARY_PATH="${LIB_DIR}:${DYLD_LIBRARY_PATH:-}"
          otool -L "$LIB_DIR/powerflow.dylib"
          echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH"
          nm -u "$LIB_DIR/powerflow.dylib" | head -50

      - name: Check architecture
        run: |
          PREFIX="$HOME/.temp/GridLAB-D"
          BIN_DIR="$PREFIX/bin"
          LIB_DIR="$PREFIX/lib"
          file "$BIN_DIR/gridlabd"
          file "$LIB_DIR"/*.dylib
          uname -m

      - name: Check rpath configuration
        run: |
          PREFIX="$HOME/.temp/GridLAB-D"
          otool -l "$PREFIX/bin/gridlabd" | grep -A 2 LC_RPATH
          otool -l "$PREFIX/lib/powerflow.dylib" | grep -A 2 LC_RPATH

      - name: Debug the empty property error
        shell: bash
        run: |
          PREFIX="$HOME/.temp/GridLAB-D"
          BIN_DIR="$PREFIX/bin"
          LIB_DIR="$PREFIX/lib"
          
          export DYLD_LIBRARY_PATH="${LIB_DIR}"
          export GLPATH="${LIB_DIR}:${PREFIX}/share/gridlabd"
          
          echo "=== Test powerflow:load class ==="
          "${BIN_DIR}/gridlabd" --modhelp powerflow:load 2>&1 || true
          
          echo "=== Check GLM file for empty properties ==="
          # Look for lines like "property ;" or "= ;" patterns
          grep -n '^\s*;' taxonomy_feeders/autotest/test_R5-25.00-1_fix.glm | head -20 || true
          grep -n '^\s*$' taxonomy_feeders/autotest/test_R5-25.00-1_fix.glm | head -20 || true
          grep -n '"";' taxonomy_feeders/autotest/test_R5-25.00-1_fix.glm | head -20 || true
          
          echo "=== Show load_1 object definition ==="
          grep -B 2 -A 30 "object load" taxonomy_feeders/autotest/test_R5-25.00-1_fix.glm | head -50 || true

      - name: Check file encoding
        run: |
          file taxonomy_feeders/autotest/test_R5-25.00-1_fix.glm
          head -1 taxonomy_feeders/autotest/test_R5-25.00-1_fix.glm | xxd | head -5
          # Check for Windows line endings
          grep -c $'\r' taxonomy_feeders/autotest/test_R5-25.00-1_fix.glm || echo "No CR found"

      - name: Run gridlabd --validate (installed)
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX="$HOME/.temp/GridLAB-D"
          BUILD_DIR="$PREFIX"
          BIN_DIR="$PREFIX/bin"
          LIB_DIR="$PREFIX/lib"
          SHARE_DIR="$PREFIX/share"
          GLDCORE_DIR="$(pwd)/gldcore"

          if [ ! -x "$BIN_DIR/gridlabd" ] && [ ! -f "$BIN_DIR/gridlabd" ]; then
            echo "gridlabd not found in $BIN_DIR"
            find "$BUILD_DIR" -maxdepth 4 -type f | sed 's|^|  |'
            exit 1
          fi

          # macOS runtime loader path
          export DYLD_LIBRARY_PATH="${LIB_DIR}:${LIB_DIR}/gridlabd:${DYLD_LIBRARY_PATH:-}"
          export DYLD_FALLBACK_LIBRARY_PATH="$LIB_DIR:$LIB_DIR/gridlabd"

          # GridLAB-D search path for modules/shares
          export GLPATH="$(pwd):${PREFIX}:${BIN_DIR}:${LIB_DIR}:${SHARE_DIR}:${GLDCORE_DIR}"

          export PATH="${PATH}:${BIN_DIR}"

          # Show versions & paths for debugging
          "${BIN_DIR}/gridlabd" --version
          echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}"
          echo "GLPATH=${GLPATH}"

          # Surface messages to console (override validate default redirection)
          "${BIN_DIR}/gridlabd" --redirect none --validate

      - name: Show validate.txt (always)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=/Users/runner/work/gridlab-d/gridlab-d
          FILE="${BUILD_DIR}/validate.txt"

          if [[ -f "${FILE}" ]]; then
            echo "==== BEGIN validate.txt ===="
            sed -n '1,200p' "${FILE}"
            echo "==== END validate.txt ===="

            {
              echo "### validate.txt (macOS)"
              sed -n '1,200p' "${FILE}"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "validate.txt not found at ${FILE}"
            echo "Listing ${BUILD_DIR} to help debug:"
            find "${BUILD_DIR}" -maxdepth 3 -type f | sed 's|^|  |'
          fi

      - name: Upload validate.txt (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-macos
          path: /Users/runner/work/gridlab-d/gridlab-d/validate.txt
          if-no-files-found: ignore

      
      - name: Upload validate_errors.txt (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-errors-macos
          path: /Users/runner/work/gridlab-d/gridlab-d/validate_errors.txt
          if-no-files-found: ignore

      - name: Upload logs for test_R5-25.00-1_fix.glm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_R5-25.00-1_fix-logs
          path: |
            /Users/runner/work/gridlab-d/gridlab-d/taxonomy_feeders/autotest/test_R5-25.00-1_fix/gridlabd.err
            /Users/runner/work/gridlab-d/gridlab-d/taxonomy_feeders/autotest/test_R5-25.00-1_fix/gridlabd.out
            /Users/runner/work/gridlab-d/gridlab-d/taxonomy_feeders/autotest/test_R5-25.00-1_fix/gridlabd.wrn
            /Users/runner/work/gridlab-d/gridlab-d/taxonomy_feeders/autotest/test_R5-25.00-1_fix/gridlabd.dbg

      - name: (Optional) Run CTest
        shell: bash
        working-directory: out/build/ci-macos
        run: |
          ctest --output-on-failure

      - name: Upload artifact (gridlabd macOS Release)
        uses: actions/upload-artifact@v4
        with:
          name: gridlabd-macos-release
          path: |
            out/build/ci-macos/bin/*
            out/build/ci-macos/share/**
